<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規アカウント登録</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h2>新規アカウント登録</h2>
    <form id="registerForm">
      <div class="input-group">
        <label for="username">ユーザー名</label>
        <input type="text" id="username" required placeholder="例: yamada_taro">
      </div>

      <div class="input-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" required placeholder="example@email.com">
      </div>
      
      <div class="input-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" required placeholder="8文字以上">
      </div>

      <div class="input-group">
        <label for="passwordConfirm">パスワード（確認用）</label>
        <input type="password" id="passwordConfirm" required placeholder="もう一度入力">
      </div>

      <button type="submit" class="btn-submit">アカウント作成</button>
    </form>
    
    <div id="message" class="message"></div>

    <div class="form-footer">
      <p>すでにアカウントをお持ちですか？ <a href="index.html">ログインはこちら</a></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
